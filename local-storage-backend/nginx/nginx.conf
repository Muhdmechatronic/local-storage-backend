events {
    worker_connections 1024;
}

http {
    # Increase buffer sizes for large uploads
    client_max_body_size 10M;
    client_body_buffer_size 128k;

    # Upstream servers
    upstream backend_api {
        server backend:3000;
    }

    upstream minio_server {
        server minio:9000;
    }

    server {
        listen 80;
        server_name _;

        # API routes (backend)
        location /api/ {
            proxy_pass http://backend_api;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for API
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Public website: home, privacy policy and account deletion pages.
        # Exact and regex matches take priority over the MinIO catch-all
        # below, so image URLs such as /app-images/... are unaffected.
        location = / {
            root /usr/share/nginx/site;
            default_type text/html;
            try_files /index.html =404;
        }

        location ~ ^/(index|privacy|delete-account)(\.html)?$ {
            root /usr/share/nginx/site;
            default_type text/html;
            add_header X-Content-Type-Options nosniff;
            add_header Referrer-Policy strict-origin-when-cross-origin;
            try_files /$1.html =404;
        }

        location ^~ /site-assets/ {
            root /usr/share/nginx/site;
            types {
                text/css css;
                image/svg+xml svg;
                image/jpeg jpg jpeg;
                image/png png;
                image/webp webp;
            }
            expires 7d;
            add_header X-Content-Type-Options nosniff;
        }

        # MinIO routes (storage)
        location / {
            proxy_pass http://minio_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeouts for MinIO
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # MinIO specific headers
            proxy_buffering off;
            proxy_request_buffering off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "nginx healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
