services:
  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: local/minio:latest
    container_name: minio-server
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - storage-net

  minio-init:
    build:
      context: ./init
      dockerfile: Dockerfile
    image: local/minio-init:latest
    container_name: minio-init
    restart: on-failure:5
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-app-images}
    networks:
      - storage-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: local/urbanmove-backend:latest
    container_name: urbanmove-backend
    restart: unless-stopped
    ports:
      - "5000:3000"
    environment:
      BACKEND_PORT: 3000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-app-images}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      # Scan model load balancer (empty = built-in default, see BACKEND_SETUP.md)
      GEMINI_MODELS: ${GEMINI_MODELS:-}
      MODEL_RPM_LIMIT: ${MODEL_RPM_LIMIT:-}
      MODEL_RPD_LIMIT: ${MODEL_RPD_LIMIT:-}
      MODEL_LIMIT_OVERRIDES: ${MODEL_LIMIT_OVERRIDES:-}
      MODEL_RPD_RESET_TZ: ${MODEL_RPD_RESET_TZ:-}
      SCAN_QUEUE_MAX_SIZE: ${SCAN_QUEUE_MAX_SIZE:-}
      SCAN_QUEUE_TIMEOUT_MS: ${SCAN_QUEUE_TIMEOUT_MS:-}
      SCAN_REQUEST_DEADLINE_MS: ${SCAN_REQUEST_DEADLINE_MS:-}
      SCAN_ATTEMPT_TIMEOUT_MS: ${SCAN_ATTEMPT_TIMEOUT_MS:-}
      SCAN_MAX_ATTEMPTS: ${SCAN_MAX_ATTEMPTS:-}
      SCAN_CIRCUIT_FAILURE_THRESHOLD: ${SCAN_CIRCUIT_FAILURE_THRESHOLD:-}
      SCAN_CIRCUIT_COOLDOWN_MS: ${SCAN_CIRCUIT_COOLDOWN_MS:-}
      SCAN_CIRCUIT_MAX_COOLDOWN_MS: ${SCAN_CIRCUIT_MAX_COOLDOWN_MS:-}
      SCAN_MODEL_DISABLE_MS: ${SCAN_MODEL_DISABLE_MS:-}
      DEBUG_AI_RESPONSE: ${DEBUG_AI_RESPONSE:-false}
      QUOTA_STORE: ${QUOTA_STORE:-memory}
      REDIS_URL: ${REDIS_URL:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
      FIREBASE_CLIENT_EMAIL: ${FIREBASE_CLIENT_EMAIL}
      FIREBASE_PRIVATE_KEY: ${FIREBASE_PRIVATE_KEY}
    volumes:
      # Edit backend/config/foodOptions.json on the host; changes apply within seconds (no rebuild)
      - ./backend/config:/app/config:ro
    depends_on:
      - minio
    networks:
      - storage-net

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: local/nginx-proxy:latest
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - minio
      - backend
    networks:
      - storage-net

  tunnel:
    image: ngrok/ngrok:latest
    container_name: minio-tunnel
    restart: unless-stopped
    depends_on:
      - nginx
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          exec ngrok http --url="https://$$NGROK_DOMAIN" nginx:80
        else
          exec ngrok http nginx:80
        fi
    networks:
      - storage-net

networks:
  storage-net:
    driver: bridge
