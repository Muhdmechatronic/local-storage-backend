services:
  minio:
    build:
      context: ./minio
      dockerfile: Dockerfile
    image: local/minio:latest
    container_name: minio-server
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: ${MINIO_SERVER_URL}
    volumes:
      - ./minio-data:/data
    command: server /data --console-address ":9001"
    networks:
      - storage-net

  minio-init:
    build:
      context: ./init
      dockerfile: Dockerfile
    image: local/minio-init:latest
    container_name: minio-init
    restart: on-failure:5
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_DEFAULT_BUCKET: ${MINIO_DEFAULT_BUCKET:-app-images}
    networks:
      - storage-net

  tunnel:
    image: ngrok/ngrok:latest
    container_name: minio-tunnel
    restart: unless-stopped
    depends_on:
      - minio
    ports:
      - "4040:4040"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
      NGROK_DOMAIN: ${NGROK_DOMAIN:-}
    entrypoint:
      - "/bin/sh"
      - "-c"
      - |
        if [ -n "$$NGROK_DOMAIN" ]; then
          exec ngrok http --url="https://$$NGROK_DOMAIN" minio:9000
        else
          exec ngrok http minio:9000
        fi
    networks:
      - storage-net

networks:
  storage-net:
    driver: bridge
